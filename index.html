<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=2.0">
    <title>Things to do today · Tdl</title>
    <!-- favicon png -->
    <link rel="icon" href="image/free-sticker-duck-9791169.png">
    <!-- Font : Pretendard(한글 포함), Instrument Serif(포인트 이탤릭), IBM Plex Mono(라벨) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
    <!-- Font Awesome (아이콘) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- css stylesheet -->
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <!-- java script -->
    <script src="js/todo.js"></script>
</head>
<body>
    <div class="page">
        <!-- 헤더: 날짜 정보와 페이지 제목 -->
        <header class="masthead">
            <div class="masthead__meta mono">
                <span>bsi · to do list</span>
                <span id="today"></span>
            </div>
            <h1 class="masthead__title">Things<br>to do <em class="serif">today</em></h1>
        </header>

        <main>
            <!-- 메인파트1 : 할일 내용 기입하고 등록하기 -->
            <section class="panel" aria-labelledby="form-title">
                <h2 id="form-title" class="sr-only">할 일 등록</h2>
                <form name="frmTodo" method="post" autocomplete="off" class="todo-form">
                    <label class="field">
                        <span class="field__label mono">date</span>
                        <input class="field__input" type="date" name="date">
                    </label>
                    <label class="field">
                        <span class="field__label mono">title</span>
                        <input class="field__input" type="text" name="task" placeholder="할 일의 제목을 지어주세요.">
                    </label>
                    <label class="field">
                        <span class="field__label mono">memo</span>
                        <textarea class="field__input" name="detail" rows="2" placeholder="할 일이 무엇인가요?"></textarea>
                    </label>
                    <div class="todo-form__actions">
                        <button type="submit" class="btn btn--primary">등록하기</button>
                    </div>
                </form>
            </section>

            <!-- 메인파트2 : 정렬 / 휴지통 + 등록된 할일 목록 -->
            <section aria-labelledby="list-title">
                <div class="toolbar">
                    <h2 id="list-title" class="toolbar__title serif">my list</h2>
                    <div class="toolbar__tools">
                        <div class="sort-wrap mono" role="group" aria-label="정렬 기준">
                            <button type="button" class="sort-action" data-sort="regist" aria-pressed="true">등록순</button>
                            <span aria-hidden="true">/</span>
                            <button type="button" class="sort-action" data-sort="date" aria-pressed="false">날짜순</button>
                        </div>
                        <button type="button" id="open-trash" class="btn btn--ghost" aria-haspopup="dialog">
                            <i class="fa-solid fa-trash-can" aria-hidden="true"></i> 휴지통 <span id="trash-count" class="count">0</span>
                        </button>
                    </div>
                </div>

                <!-- js/todo.js에서 렌더링 -->
                <ul id="todo-items" class="todo-grid"></ul>
            </section>

            <!-- 휴지통 모달 -->
            <dialog id="trash-modal" class="modal" aria-labelledby="trash-title">
                <div class="modal__head">
                    <h2 id="trash-title" class="modal__title">휴지통</h2>
                    <button type="button" id="close-trash" class="icon-btn" aria-label="닫기">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <ul id="trash-items" class="trash-list"></ul>
            </dialog>

            <!-- 할일 카드 템플릿 -->
            <script type="text/html" id="tpl">
                <li id="item-${uid}" class="todo-card" data-done="${done}">
                    <div class="todo-card__head">
                        <button type="button" class="check toggle-action" data-uid="${uid}" aria-pressed="${done}" aria-label="완료 표시">
                            <i class="fa-solid fa-check" aria-hidden="true"></i>
                        </button>
                        <time class="todo-card__date mono" datetime="${date}">${date}</time>
                    </div>
                    <h3 class="todo-card__title"><span class="strike">${title}</span></h3>
                    <p class="todo-card__content"><span class="strike strike--thin">${content}</span></p>
                    <div class="todo-card__actions">
                        <button type="button" class="chip edit-action" data-uid="${uid}">수정</button>
                        <button type="button" class="chip delete-action" data-uid="${uid}">삭제</button>
                    </div>
                </li>
            </script>

            <!-- 휴지통 항목 템플릿 -->
            <script type="text/html" id="tpl-trash">
                <li id="trash-${uid}" class="trash-item">
                    <div class="trash-item__text">
                        <span class="mono">${date}</span>
                        <strong>${title}</strong>
                        <span>${content}</span>
                    </div>
                    <div class="trash-item__actions">
                        <button type="button" class="chip restore-action" data-uid="${uid}">복구</button>
                        <button type="button" class="chip chip--danger destroy-action" data-uid="${uid}">영구삭제</button>
                    </div>
                </li>
            </script>
        </main>

        <!-- 하단 정보 : 프로젝트 제목과 발표일 등 정보 명시 -->
        <footer class="colophon">
            <p class="colophon__quote serif">remember, <em>consistency</em> over perfection.</p>
            <p class="colophon__info mono">KANT AX 1기 · Mini Team Project : Frontend Dev. · Frontend Team 02 · 2026-10-02</p>
        </footer>
    </div>
</body>
</html>
